name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile.musl -t xiaozhi-musl docker/

      - name: Compile
        run: |
          mkdir -p output
          docker run --rm \
            -v "$(pwd)":/src \
            -v "$(pwd)/output":/output \
            xiaozhi-musl:latest \
            bash /src/docker/build-musl.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-r328
          path: |
            output/xiaozhi-r328
            output/models/
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/xiaozhi-r328
            output/models/*.tflite
            output/models/*.json
            config.json
          name: Release ${{ github.ref_name }}
